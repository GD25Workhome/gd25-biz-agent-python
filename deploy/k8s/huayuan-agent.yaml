# 华院规则二评分服务 — K8s 示例清单
# 使用前替换镜像仓库地址、MySQL 与密钥。
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: huayuan-agent-config
data:
  LANGFUSE_ENABLED: "false"
  # event worker 与 API 同进程；也可设 false 并单独运行 python -m radar_score
  RADAR_SCORE_WORKER_IN_APP: "true"
  RADAR_SCORE_EVENT_CONCURRENCY: "2"
  EXHIBITION_MYSQL_HOST: "replace-me"
  EXHIBITION_MYSQL_PORT: "3306"
  EXHIBITION_MYSQL_DB: "unidt_exhibition"
---
apiVersion: v1
kind: Secret
metadata:
  name: huayuan-agent-secrets
type: Opaque
stringData:
  # 华院 LLM 网关（provider=huayuan）
  HUAYUAN_API_KEY: "replace-me"
  # 规则二 v3 检索链（DeepSeek Search / Fetch）
  DEEPSEEK_SEARCH_KEY: "replace-me"
  # exhibition MySQL（任务 / 事件 / 区域）
  EXHIBITION_MYSQL_USER: "replace-me"
  EXHIBITION_MYSQL_PASSWORD: "replace-me"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: huayuan-agent
  labels:
    app: huayuan-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: huayuan-agent
  template:
    metadata:
      labels:
        app: huayuan-agent
    spec:
      containers:
        - name: huayuan-agent
          image: bj-unidt.tencentcloudcr.com/unidt-repo/unidt-exhibition-opportunity-py-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: huayuan-agent-config
            - secretRef:
                name: huayuan-agent-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: huayuan-agent
spec:
  selector:
    app: huayuan-agent
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
