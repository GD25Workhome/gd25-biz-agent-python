        <h3>平安银行发布2026年中报</h3>
        <h5>2026-08-26</h5>
        <div class="content">
            <p>平安银行股份有限公司（以下简称"平安银行"或"本行"）于2026年8月26日正式发布2026年中期业绩报告。</p>
            <p>报告显示，2026年上半年，本行实现营业收入580亿元，同比增长8.5%；净利润达到185亿元，同比增长5.2%。</p>
            <p>在数字化转型方面，本行持续加大科技投入，推进"AI+金融"战略，不断提升客户体验和经营效率。截至报告期末，零售客户数突破1.2亿户。</p>
            <p>展望未来，平安银行将继续深化"科技引领、零售突破、对公做精"的转型战略，为股东创造更大价值。</p>
