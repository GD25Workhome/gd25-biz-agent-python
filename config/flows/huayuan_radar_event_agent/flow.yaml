# 华院规则二：ReAct + AnySearch + 展厅需求两维评分
name: huayuan_radar_event_agent
version: "1.0"
description: "华院规则二：ReAct + AnySearch 自查证据 + 两维离散分与证据链"

nodes:
  - name: radar_event_react_node
    type: agent
    config:
      prompt: prompts/radar_event_react.md
      model:
        provider: doubao
        temperature: 0.2
        thinking:
          type: disabled
      tools:
        - anysearch_web_search
        - anysearch_extract

edges:
  - from: radar_event_react_node
    to: END
    condition: always

entry_node: radar_event_react_node
