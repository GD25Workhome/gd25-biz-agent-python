# 华院规则二 v3：单 Agent ReAct + DeepSeek Search/Fetch 唯一检索链路
#   + 质检闸门（function，确定性规则：时效 / 日期纪律）
#   + 时效复核（agent，语义复核，只降不升）
# 形态＝裁定 D10 的 (C)：图内「改好」、图外 self_check「拦住」，规则同源调用 radar_score/rules/*
# 条件边只用「条件边」（同一节点不可与 always 混用）；未命中时 route_func 回退 END。
# 目标架构见 华院Agent设计/261016-Agent重构/Agent整体设计/04-总体设计.md
name: huayuan_radar_event_agent_v3
version: "3.0"
description: "华院规则二 v3：ReAct 检索评分 + 质检闸门(function) + 时效复核(agent)；输出两维分 + 建议等级 + v3 扩展字段"

nodes:
  - name: radar_event_react_node
    type: agent
    config:
      prompt: prompts/radar_event_v3.md
      model:
        provider: huayuan
        temperature: 0.2
        # 单 Agent 串行多轮检索，链路较长；显式超时避免无限挂起
        timeout: 300
        thinking:
          type: disabled
      # 唯一证据链路：DeepSeek Search + Fetch（独立工具，不做配额/去重）
      # + 区域字典查询（确定「展厅所在区域」，逐级下钻 province→city→district）
      tools:
        - deepseek_web_search
        - deepseek_fetch
        - region_lookup
        - region_children
      persist_to_persistence_edges_var:
        - radar_event_score
        - radar_event_scores

  # 第 2 节点：质检闸门（纯代码）—— R9 剔跑批日戳/行情页、R7 超窗置 expired、给出 radar_audit_required
  - name: radar_rule_gate
    type: function
    config:
      function_key: "radar_rule_gate_func"

  # 第 3 节点：时效复核（LLM，只降不升）—— 不挂检索工具：只依据给定证据做语义复核
  - name: radar_event_audit_node
    type: agent
    config:
      prompt: prompts/radar_event_audit_v3.md
      model:
        provider: huayuan
        temperature: 0.1
        timeout: 300
        thinking:
          type: disabled
      persist_to_persistence_edges_var:
        - radar_event_scores
        - evidences
        - discarded

edges:
  - from: radar_event_react_node
    to: radar_rule_gate
    condition: always

  # 经硬闸后**仍有分**的事件存在 → 走语义复核；否则直接 END（未命中条件时回退 END）
  - from: radar_rule_gate
    to: radar_event_audit_node
    condition: radar_audit_required == true

  - from: radar_event_audit_node
    to: END
    condition: always

entry_node: radar_event_react_node