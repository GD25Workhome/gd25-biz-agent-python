# 华院最小后端 — K8s 示例清单
# 使用前替换镜像仓库地址，并用真实 Secret 注入 API Key。
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: huayuan-agent-config
data:
  ENABLE_DATABASE: "false"
  LANGFUSE_ENABLED: "false"
  PROMPT_SOURCE_MODE: "local"
  NEWS_CRAWL_ENABLED: "true"
  ANTHROPIC_BASE_URL: "https://ai-api.unidtai.com/openapi/llm/anthropic"
  ANTHROPIC_MODEL: "deepseek/deepseek-v4.1-flash"
  # 代码默认已是 false；显式写出，避免以后改默认时 test 误开抓取
  RADAR_KB_WORKER_IN_APP: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: huayuan-agent-secrets
type: Opaque
stringData:
  # 华院 LLM 主密钥（provider=huayuan）；可与 ANTHROPIC_AUTH_TOKEN 同一把网关 key
  HUAYUAN_API_KEY: "replace-me"
  ANTHROPIC_AUTH_TOKEN: "replace-me"
  ANY_SEARCH_API_KEY: "replace-me"
  BO_CHA_APIKEY: "replace-me"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: huayuan-agent
  labels:
    app: huayuan-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: huayuan-agent
  template:
    metadata:
      labels:
        app: huayuan-agent
    spec:
      containers:
        - name: huayuan-agent
          image: bj-unidt.tencentcloudcr.com/unidt-repo/unidt-exhibition-opportunity-py-agent:v1-260911
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: huayuan-agent-config
            - secretRef:
                name: huayuan-agent-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: huayuan-agent
spec:
  selector:
    app: huayuan-agent
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
