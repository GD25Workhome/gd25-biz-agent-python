# 模型供应商配置文件
# 定义所有可用的模型供应商及其配置信息

providers:
  # OpenAI供应商
  - provider: "openai"
    api_key: "${OPENAI_API_KEY}"  # 从环境变量读取
    base_url: "https://api.openai.com/v1"
  
  # 豆包（火山引擎）供应商
  - provider: "doubao"
    api_key: "${DOUBAO_API_KEY}"  # 从环境变量读取
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    # default_model: "doubao-seed-1-8-251228"  # 默认模型名称（可选，当 flow.yaml 中未指定 model.name 时使用）
    default_model: "doubao-seed-2-1-turbo-260628"

  # 豆包（火山引擎）供应商(embedding)
  - provider: "doubao-embedding"
    api_key: "${DOUBAO_API_KEY}"  # 从环境变量读取
    base_url: "https://ark.cn-beijing.volces.com/api/v3/embeddings"
    default_model: "doubao-embedding-vision-250615"
  
  # DeepSeek供应商
  - provider: "deepseek"
    api_key: "${DEEPSEEK_API_KEY}"  # 从环境变量读取
    base_url: "https://api.deepseek.com"

  - provider: "huayuan"
    api_key: "${HUAYUAN_API_KEY}"
    # SDK 会自己拼 /chat/completions，这里只能写到 /v1
    base_url: "https://ai-api.unidtai.com/openapi/llm/compatible-mode/v1"
    # 网关实测可用：qwen-plus / qwen3-max / deepseek-v3 / deepseek-chat
    default_model: "deepseek/deepseek-v4.1-flash"